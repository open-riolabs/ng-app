name: CI/CD Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  versioning:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    outputs:
      GitVersion_SemVer: ${{ env.GitVersion_SemVer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0 # 0 indica di ottenere tutta la cronologia
      - name: Install GitVersion.Tool
        id: gitversion
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          export PATH="$PATH:/github/home/.dotnet/tools"
          dotnet-gitversion /config ./GitVersion.yml /nocache /verbosity Diagnostic /output buildserver
        env:
          GIT_DEPTH: 10000
      - name: Display Version
        run: echo "Version> ${{ env.GitVersion_SemVer }}"

  # Every job below runs on the same ubuntu-latest image and does its own `npm ci`.
  #
  # It used to install once on `node:alpine` (musl), tar up node_modules and hand the tarball to a
  # `node:lts-bullseye` (glibc) job. Native and platform-specific optional deps (@esbuild/*,
  # @rollup/*, @rolldown/*, lmdb, @parcel/watcher) do not survive that libc switch, so the consumer
  # job had to reify with a second `npm install` on top of the artifact anyway. Uploading ~200 MB to
  # re-download and then repair it is slower than a cached `npm ci`, and it is how a release gets
  # built from a tree matching no committed lockfile.
  #
  # `npm ci`, not `npm install`: it deletes node_modules, installs the lockfile exactly, and fails
  # loudly if package.json and the lock disagree. `actions/setup-node`'s `cache: npm` caches the npm
  # *download* cache keyed on the lockfile, which is safe — unlike caching node_modules itself.
  #
  # RLB_SKIP_SKILL_SYNC skips the root postinstall, which syncs @open-rlb/ng-bootstrap's Claude
  # skills into .claude/skills for local development. CI never reads them: the library bundles from
  # projects/rlb/ng-app/skills.

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          RLB_SKIP_SKILL_SYNC: '1'
        run: npm ci
      - name: Test app
        run: npx ng test ng-baseapp --no-watch --no-progress --browsers=ChromeHeadless
      - name: Test library
        run: npm run lib:test-ci
      - name: Check import hygiene
        run: npm run check:imports
      - name: Test ng-add schematic
        run: npm run lib:test:ng-add

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          RLB_SKIP_SKILL_SYNC: '1'
        run: npm ci
      - name: Build
        run: npm run lib:build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      deployments: write
    needs:
      - build
      - versioning
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Set Version and Publish
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org/"
          scope: "@open-rlb"
      - run: |
          cp ./package.json ./dist
          cp ./package-lock.json ./dist
          cp ./README.md ./dist
          cd ./dist/rlb/ng-app
          npm version ${{ needs.versioning.outputs.GitVersion_SemVer }} --git-tag-version false
          npm publish --allow-same-version --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OPEN_RLB }}

      - name: Tag repo with new version
        uses: cardinalby/git-tag-action@master
        env:
          TAG: ${{ needs.versioning.outputs.GitVersion_SemVer }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
