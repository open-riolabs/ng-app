name: CI/CD Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  versioning:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    outputs:
      GitVersion_SemVer: ${{ env.GitVersion_SemVer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0 # 0 indica di ottenere tutta la cronologia
      - name: Install GitVersion.Tool
        id: gitversion
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          export PATH="$PATH:/github/home/.dotnet/tools"
          dotnet-gitversion /config ./GitVersion.yml /nocache /verbosity Diagnostic /output buildserver
        env:
          GIT_DEPTH: 10000
      - name: Display Version
        run: echo "Version> ${{ env.GitVersion_SemVer }}"

  dependencies:
    runs-on: ubuntu-latest
    container:
      image: node:alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
      - name: Install dependencies
        # The root postinstall syncs @open-rlb/ng-bootstrap's Claude skills into .claude/skills for
        # local development. CI never reads them (the library bundles from
        # projects/rlb/ng-app/skills), so skip it.
        #
        # `npm ci`, not `npm install`: the cache step above restores on a prefix `restore-keys`, so a
        # lockfile change misses the exact key and hands us a node_modules built from a *different*
        # lockfile. `npm install` then mutates that tree in place — keeping packages that merely
        # satisfy the range instead of the locked version, and rewriting package-lock.json in the
        # runner — which is how a release gets built from deps matching no committed lockfile.
        # `npm ci` deletes node_modules first, installs the lockfile exactly, and fails loudly if
        # package.json and the lock disagree.
        env:
          RLB_SKIP_SKILL_SYNC: '1'
        run: |
          npm ci
      - name: Create node_modules TarGz
        run: tar -czf node_modules.tar.gz node_modules
      - name: Upload TarGz Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node_modules-tar # Artifact name
          path: node_modules.tar.gz # Path to the created `.tar.gz`

  build:
    needs: dependencies
    runs-on: ubuntu-latest
    container:
      image: node:lts-bullseye
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download TarGz Artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules-tar # The artifact name
          path: ./ # Where to download the artifact
      - name: Extract node_modules
        run: tar -xzf node_modules.tar.gz
      - name: Build
        # `npm install` here is not redundant: the node_modules artifact is built by the
        # `dependencies` job on node:alpine (musl) and consumed here on node:lts-bullseye (glibc),
        # so the platform-specific optional deps in the tarball are the wrong ones (@esbuild/*,
        # @rollup/*, @rolldown/*, lmdb, @parcel/watcher — the lockfile carries both variants).
        # This reify used to happen as a side effect of two `npm link` lines (husky, @nestjs/cli)
        # that this repo never needed — neither package is a dependency of it. They broke when
        # @nestjs/cli@12.0.0 (2026-08-27) added `prepare: "husky && node tools/postinstall.cjs"`,
        # a script that only works inside Nest's own git checkout: npm runs `prepare` for
        # link-installed packages, and `tools/` is not in the published tarball. 11.0.24 and
        # earlier declared `prepare: "husky"`, which exits 0 outside a git repo — which is why this
        # step passed for the 19 months before that release.
        # --ignore-scripts keeps third-party lifecycle scripts out of the build (this runner's
        # allowScripts policy already blocks them) and skips the root postinstall skill sync, which
        # CI does not need — the library bundles skills from projects/rlb/ng-app/skills.
        run: |
          npm install --ignore-scripts
          npm run lib:build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      deployments: write
    needs:
      - build
      - versioning
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download TarGz Artifact
        uses: actions/download-artifact@v4
        with:
          name: node_modules-tar
          path: ./
      - name: Extract node_modules
        run: tar -xzf node_modules.tar.gz
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Set Version and Publish
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org/"
          scope: "@open-rlb"
      - run: |
          cp ./package.json ./dist
          cp ./package-lock.json ./dist
          cp ./README.md ./dist
          cd ./dist/rlb/ng-app
          npm version ${{ needs.versioning.outputs.GitVersion_SemVer }} --git-tag-version false
          npm publish --allow-same-version --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OPEN_RLB }}

      - name: Tag repo with new version
        uses: cardinalby/git-tag-action@master
        env:
          TAG: ${{ needs.versioning.outputs.GitVersion_SemVer }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
