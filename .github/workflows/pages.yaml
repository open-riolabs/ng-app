name: Docs

# Publishes docs/ to GitHub Pages. Pages must be set to "GitHub Actions" as its source in the
# repository settings.
on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
